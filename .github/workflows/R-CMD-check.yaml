# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.tests }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release', tests: 'full', not_cran: 'true'}
          - {os: windows-latest, r: 'release', tests: 'full', not_cran: 'true'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', tests: 'full', not_cran: 'true'}
          - {os: ubuntu-latest,   r: 'release', tests: 'full', not_cran: 'true'}
          - {os: ubuntu-latest,   r: 'release', tests: 'CRAN core', not_cran: 'false'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: ${{ matrix.config.not_cran }}
      # Visual snapshots run in the separate macOS workflow.
      VDIFFR_RUN_TESTS: "false"
      VDIFFR_LOG_PATH: "../vdiffr.Rout.fail"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: always

      - uses: r-lib/actions/setup-tinytex@v2
      - run: tlmgr --version
      
      - name: Install ghostscript on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install ghostscript

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, lme4=?source, mvnfast=?source
          pak-version: stable
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
