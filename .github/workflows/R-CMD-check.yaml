# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      config:
        description: R and platform combinations for package checks
        required: true
        type: string

name: R-CMD-check

concurrency:
  group: R-CMD-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.tests }}, glmmTMB ${{ matrix.config.glmmtmb || 'release' }})

    strategy:
      fail-fast: false
      matrix:
        # The weekly workflow supplies the broader compatibility matrix.
        config: >-
          ${{ fromJSON(inputs.config || '[
            {"os": "macOS-latest", "r": "release", "tests": "CRAN core", "not_cran": "false"},
            {"os": "windows-latest", "r": "release", "tests": "CRAN core", "not_cran": "false"},
            {"os": "ubuntu-latest", "r": "release", "tests": "CRAN core", "not_cran": "false"}
          ]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: ${{ matrix.config.not_cran }}
      # Visual snapshots run in the separate macOS workflow.
      VDIFFR_RUN_TESTS: "false"
      VDIFFR_LOG_PATH: "../vdiffr.Rout.fail"
      # Keep builder progress outside captured messages and snapshots.
      GRATIA_TEST_DIAGNOSTICS: ${{ (matrix.config.os == 'macOS-latest' && matrix.config.r == 'oldrel' || matrix.config.os == 'windows-11-arm') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: ${{ runner.os != 'Windows' || runner.arch != 'ARM64' }}

      - name: Verify native Windows ARM R
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: Rscript {0}
        run: |
          stopifnot(grepl("aarch64|arm64", R.version$platform, ignore.case = TRUE))
          print(sessionInfo())

      - name: Install ghostscript on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install ghostscript

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::rstantools
            lme4=?source
            mvnfast=?source
            ${{ matrix.config.glmmtmb == 'development' && 'glmmTMB=github::glmmTMB/glmmTMB/glmmTMB@master' || 'any::glmmTMB' }}
            ${{ runner.os == 'macOS' && 'TMB=?source&reinstall' || '' }}
          pak-version: stable
          needs: check

      - name: Run focused macOS oldrel threshold tests
        if: runner.os == 'macOS' && matrix.config.r == 'oldrel'
        timeout-minutes: 15
        env:
          GRATIA_TEST_PROGRESS: ${{ runner.temp }}/threshold-test-progress.log
        run: Rscript --vanilla tools/test-sdmtmb-thresholds.R
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        env:
          GRATIA_TEST_PROGRESS: ${{ (runner.os == 'macOS' && matrix.config.r == 'oldrel' || runner.os == 'Windows' && runner.arch == 'ARM64') && format('{0}/check-test-progress.log', runner.temp) || '' }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # Optional integrations run weekly, after the package check has finished.
      - name: Check optional inlaws diagnostic integration
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.config.r == 'release' && matrix.config.tests == 'full' && matrix.config.glmmtmb != 'development' }}
        shell: Rscript {0}
        run: |
          pak::pkg_install("gam-mafia/inlaws")
          source("tools/test-inlaws-diagnostics.R")

      - name: Check optional bayesplot and loo integration
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.config.r == 'release' && matrix.config.tests == 'full' && matrix.config.glmmtmb != 'development' }}
        run: Rscript --vanilla inst/validation/optional-bayesplot-loo.R
        shell: bash

      - name: Show test progress and check output
        if: always() && (runner.os == 'macOS' && matrix.config.r == 'oldrel' || runner.os == 'Windows' && runner.arch == 'ARM64')
        shell: bash
        run: |
          for log in "$RUNNER_TEMP/threshold-test-progress.log" "$RUNNER_TEMP/check-test-progress.log"; do
            if [ -f "$log" ]; then
              printf '\n%s\n' "$log"
              tail -n 100 "$log"
            fi
          done
          if [ -d check ]; then
            find check -type f \( -name 'test-all.Rout*' -o -name '00check.log' \) \
              -print -exec tail -n 100 '{}' \;
          fi

      - name: Upload test progress and check logs
        if: always() && (runner.os == 'macOS' && matrix.config.r == 'oldrel' || runner.os == 'Windows' && runner.arch == 'ARM64')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.config.r }}-check-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/threshold-test-progress.log
            ${{ runner.temp }}/check-test-progress.log
            check/**/tests/test-all.Rout*
            check/**/00check.log
            check/**/00install.out
