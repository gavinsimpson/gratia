name: Weekly checks
run-name: Weekly checks (${{ inputs.check || 'scheduled' }})

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      check:
        description: Check to run on the selected branch
        type: choice
        default: all
        options:
          - all
          - packages
          - package-ubuntu
          - package-macos
          - package-macos-oldrel
          - package-windows
          - package-windows-arm
          - windows-arm-spatial
          - visual
          - paper-examples
          - sdmtmb-linux
          - sdmtmb-windows-arm
          - coverage
          - r-devel
          - glmmtmb-development
          - inlaws

permissions:
  contents: read

concurrency:
  group: weekly-checks-${{ github.ref }}-${{ inputs.check || 'scheduled' }}

jobs:
  package-checks:
    if: ${{ !inputs.check || inputs.check == 'all' || inputs.check == 'packages' || startsWith(inputs.check, 'package-') }}
    uses: ./.github/workflows/R-CMD-check.yaml
    with:
      group: weekly-packages
      check: ${{ startsWith(inputs.check, 'package-') && inputs.check || '' }}
      config: >-
        {
          "package-ubuntu": {"id": "package-ubuntu", "os": "ubuntu-latest", "r": "release", "tests": "full", "not_cran": "true"},
          "package-macos": {"id": "package-macos", "os": "macOS-latest", "r": "release", "tests": "full", "not_cran": "true"},
          "package-macos-oldrel": {"id": "package-macos-oldrel", "os": "macOS-latest", "r": "oldrel", "tests": "CRAN core", "not_cran": "false"},
          "package-windows": {"id": "package-windows", "os": "windows-latest", "r": "release", "tests": "full", "not_cran": "true"},
          "package-windows-arm": {"id": "package-windows-arm", "os": "windows-11-arm", "r": "release", "tests": "full", "not_cran": "true"}
        }

  secondary:
    if: ${{ !inputs.check || inputs.check == 'all' || inputs.check == 'visual' || inputs.check == 'paper-examples' }}
    uses: ./.github/workflows/test-secondary.yaml
    with:
      check: ${{ inputs.check || 'all' }}

  windows-arm-spatial:
    # Use the same test selection as the isolated phase of the full ARM check.
    if: inputs.check == 'windows-arm-spatial'
    uses: ./.github/workflows/R-CMD-check.yaml
    with:
      group: weekly-windows-arm-spatial
      config: >-
        {
          "windows-arm-spatial": {"id": "windows-arm-spatial", "os": "windows-11-arm", "r": "release", "tests": "spatial only", "not_cran": "true"}
        }

  sdmtmb:
    if: ${{ !inputs.check || inputs.check == 'all' || startsWith(inputs.check, 'sdmtmb-') }}
    uses: ./.github/workflows/test-sdmtmb.yaml
    with:
      check: ${{ inputs.check || 'all' }}

  coverage:
    if: ${{ !inputs.check || inputs.check == 'all' || inputs.check == 'coverage' }}
    uses: ./.github/workflows/test-coverage.yaml
    secrets: inherit

  upstream:
    # The upstream workflow has its own schedule. A manual run can include it.
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","r-devel","glmmtmb-development","inlaws"]'), inputs.check) }}
    uses: ./.github/workflows/weekly-upstream.yaml
    with:
      check: ${{ inputs.check }}
