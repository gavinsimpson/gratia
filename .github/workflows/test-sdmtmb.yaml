name: sdmTMB compatibility

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      check:
        description: sdmTMB checks to run
        type: string
        default: all

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    name: sdmTMB (${{ matrix.os }}, release-RTMB)
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            inputs.check == 'sdmtmb-linux' && '["ubuntu-latest"]' ||
            inputs.check == 'sdmtmb-windows-arm' && '["windows-11-arm"]' ||
            '["ubuntu-latest", "windows-11-arm"]'
          ) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: 'true'
      VDIFFR_RUN_TESTS: 'false'
      GRATIA_SDMTMB_BACKEND: rtmb
      GRATIA_TEST_DIAGNOSTICS: ${{ matrix.os == 'windows-11-arm' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: ${{ runner.arch != 'ARM64' }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::glmmTMB
            any::RTMB
            any::sdmTMB
          needs: check
      - name: Check formula effects and response diagnostics
        timeout-minutes: 90
        run: |
          backend <- Sys.getenv("GRATIA_SDMTMB_BACKEND")
          stopifnot(requireNamespace("RTMB", quietly = TRUE),
            packageVersion("sdmTMB") >= "1.2.0", backend == "rtmb")
          options(sdmTMB.backend = "rtmb")
          if (Sys.getenv("RUNNER_ARCH") == "ARM64") {
            stopifnot(grepl("aarch64|arm64", R.version$platform, ignore.case = TRUE))
          }
          print(sessionInfo())
          for (package in c("sdmTMB", "RTMB", "TMB", "Matrix", "mgcv")) {
            cat(package, as.character(packageVersion(package)), "\n")
          }
          cat("Requested sdmTMB backend:", backend, "\n")
          testthat::test_local(filter = "^sdmtmb", stop_on_failure = TRUE)
        shell: Rscript {0}
