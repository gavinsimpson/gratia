name: sdmTMB compatibility

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    name: sdmTMB (${{ matrix.config.name }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: legacy-1.1.0, package: 'sdmTMB@1.1.0', backend: ''}
          - {name: release-TMB, package: 'any::sdmTMB', backend: tmb}
          - {name: release-RTMB, package: 'any::sdmTMB', backend: rtmb}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: 'true'
      VDIFFR_RUN_TESTS: 'false'
      GRATIA_SDMTMB_BACKEND: ${{ matrix.config.backend }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::glmmTMB
            ${{ matrix.config.package }}
          needs: check
      - name: Check formula effects and response diagnostics
        run: |
          backend <- Sys.getenv("GRATIA_SDMTMB_BACKEND")
          if (nzchar(backend)) options(sdmTMB.backend = backend)
          pkgload::load_all()
          print(packageVersion("sdmTMB"))
          source("tests/testthat/helper-vdiffr.R")
          files <- list.files("tests/testthat", pattern = "^test-sdmtmb.*\\.R$",
            full.names = TRUE)
          for (file in files) testthat::test_file(file,
            reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}
